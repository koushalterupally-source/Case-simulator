name: PYQ app

on:
  push:
    paths:
      - 'pyq-app/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/pyq-app.yml'
  pull_request:
    paths:
      - 'pyq-app/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/pyq-app.yml'
  workflow_dispatch:

jobs:
  unit:
    name: Engine, simulator and sanitizer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The case simulator is moving to its own repository. While it is still here, test it;
      # once it leaves, these steps skip rather than fail the run.
      - name: Is the case simulator still in this repo?
        id: sim
        run: |
          if [ -f package.json ] && [ -f vite.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sim.outputs.present == 'true'
        run: npm ci

      - name: Typecheck case simulator
        if: steps.sim.outputs.present == 'true'
        run: npm run lint

      - name: Test case simulator
        if: steps.sim.outputs.present == 'true'
        run: npm test

      # The PYQ app has no dependencies and no build step — Node's own test runner is enough.
      - name: Engine and sanitizer unit tests
        working-directory: pyq-app
        run: node --test

  pipeline:
    name: Data pipeline and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      # Neither the question bank nor the case simulator is vendored here; both are cloned.
      - name: Fetch the question bank
        run: git clone --depth 1 https://github.com/koushalterupally-source/Medqbank /tmp/medqbank

      # stage.sh finds the simulator in this checkout while it is still here, and falls back to
      # cloning once it has moved. Passing SIMULATOR_SRC when we already have it avoids the clone.
      - name: Build and stage unified product
        run: bash pyq-app/build/stage.sh /tmp/medqbank/android/app/src/main/assets dist

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: End-to-end smoke test
        run: node pyq-app/tests/smoke.mjs --root dist --shots dist/.shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyq-app-screens
          path: dist/.shots
          retention-days: 14
          if-no-files-found: ignore
