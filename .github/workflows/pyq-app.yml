name: PYQ app

on:
  push:
    paths:
      - 'pyq-app/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/pyq-app.yml'
  pull_request:
    paths:
      - 'pyq-app/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/pyq-app.yml'
  workflow_dispatch:

jobs:
  unit:
    name: Engine, simulator and sanitizer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck case simulator
        run: npm run lint

      - name: Test case simulator
        run: npm test

      - name: Engine and sanitizer unit tests
        working-directory: pyq-app
        run: node --test

  pipeline:
    name: Data pipeline and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # The question bank lives in a separate repository and is never vendored here.
      - name: Fetch the question bank
        run: git clone --depth 1 https://github.com/koushalterupally-source/Medqbank /tmp/medqbank

      - name: Build and stage unified product
        run: bash pyq-app/build/stage.sh /tmp/medqbank/android/app/src/main/assets dist

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: End-to-end smoke test
        run: node pyq-app/tests/smoke.mjs --root dist --shots dist/.shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyq-app-screens
          path: dist/.shots
          retention-days: 14
          if-no-files-found: ignore
