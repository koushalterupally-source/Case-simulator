name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The case simulator now lives in its own repository; stage.sh clones it. These steps
      # remain only for a checkout that still carries it, and skip otherwise rather than
      # failing the deploy on a file that is deliberately gone.
      - name: Is the case simulator still in this repo?
        id: sim
        run: |
          if [ -f package.json ] && [ -f vite.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sim.outputs.present == 'true'
        run: npm ci

      - name: Typecheck case simulator
        if: steps.sim.outputs.present == 'true'
        run: npm run lint

      - name: Test case simulator
        if: steps.sim.outputs.present == 'true'
        run: npm test

      # The PYQ app has no dependencies and no build step.
      - name: Engine and sanitizer unit tests
        working-directory: pyq-app
        run: node --test

      # The question bank lives in a separate repository and is never vendored here.
      - name: Fetch the question bank
        run: git clone --depth 1 https://github.com/koushalterupally-source/Medqbank /tmp/medqbank

      - name: Build and stage unified product
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: bash pyq-app/build/stage.sh /tmp/medqbank/android/app/src/main/assets dist

      - name: Add SPA 404 fallbacks
        run: |
          cp dist/index.html dist/404.html
          cp dist/simulator/index.html dist/simulator/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API if it isn't already, so this doesn't
          # require a manual visit to Settings -> Pages before the first deploy.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
