<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Offline clinical case simulator driven by NEET-PG and INI-CET previous year questions." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c96442'/><path d='M22 50h14l7-16 12 32 8-16h15' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Clinical Case Simulator — NEET-PG & INI-CET</title>
    <script>
      // ?reset — full local wipe, handled here rather than in React so it still
      // works when the app bundle itself fails to load. This is the escape hatch
      // from a blank screen: unregister workers, drop every cache, clear storage,
      // then reload clean.
      (function () {
        if (window.location.search.indexOf('reset') === -1) return;
        var finish = function () {
          window.location.replace(window.location.pathname);
        };
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) {}
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
          );
        }
        if (window.caches) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          );
        }
        if (window.indexedDB && indexedDB.databases) {
          jobs.push(
            indexedDB.databases().then(function (dbs) {
              return Promise.all(
                dbs.map(function (db) { return db.name && indexedDB.deleteDatabase(db.name); })
              );
            })
          );
        }
        Promise.all(jobs).catch(function () {}).then(finish);
        // Don't let anything else run during a reset.
        window.stop && window.stop();
      })();
    </script>
  </head>
  <body>
    <!--
      A boot fallback lives inside #root. React replaces it the moment it mounts,
      so it is invisible in normal use — but if the bundle 404s or throws before
      mounting, the user gets a message and a one-tap fix instead of a blank
      white screen with nothing to report.
    -->
    <div id="root">
      <div
        id="boot-fallback"
        style="
          font-family: ui-sans-serif, system-ui, sans-serif;
          max-width: 26rem;
          margin: 18vh auto 0;
          padding: 0 1.5rem;
          color: #1f1e1d;
        "
      >
        <p style="font-size: 17px; font-weight: 600; margin: 0 0 0.5rem">Still loading…</p>
        <p id="boot-msg" style="font-size: 15px; line-height: 1.6; color: #73716c; margin: 0 0 1.25rem">
          If this doesn't clear in a few seconds, the app failed to start.
        </p>
        <a
          id="boot-reset"
          href="?reset=1"
          style="
            display: inline-block;
            background: #c96442;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            padding: 0.65rem 1.1rem;
            border-radius: 12px;
          "
          >Reset and reload</a
        >
        <pre
          id="boot-err"
          style="
            display: none;
            margin-top: 1.25rem;
            font-size: 12px;
            white-space: pre-wrap;
            color: #a63d32;
          "
        ></pre>
      </div>
    </div>

    <script>
      // Surface a boot failure in the fallback rather than leaving it blank.
      // Capture phase: a failed <script> fires an error that does NOT bubble,
      // so a non-capturing listener never sees it.
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-err');
        var msg = document.getElementById('boot-msg');
        if (!box || !document.getElementById('boot-fallback')) return;
        if (msg) msg.textContent = 'The app failed to start. Resetting usually fixes it.';
        box.style.display = 'block';
        var target = e && e.target;
        var what = target && target.src ? 'Failed to load ' + target.src : String((e && (e.message || e.error)) || 'Unknown error');
        box.textContent = what;
      }, true);

      // Self-heal: if the app has not mounted shortly after load, the cached
      // shell is almost certainly pointing at assets that no longer exist.
      // Clear service workers and caches once, then reload.
      setTimeout(function () {
        if (!document.getElementById('boot-fallback')) return; // app mounted, nothing to do
        if (sessionStorage.getItem('boot-healed')) return; // only ever once
        try { sessionStorage.setItem('boot-healed', '1'); } catch (e) {}
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).catch(function () {}).then(function () { window.location.reload(); });
      }, 6000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration that can recover from itself.
      //
      // A cached index.html references hashed asset filenames. After a deploy
      // those filenames change, so a stale cached shell asks for JS that no
      // longer exists and the page renders blank. Force an update check on
      // every load, and reload once when a new worker takes control so a stuck
      // client heals itself instead of needing its cache cleared by hand.
      if ('serviceWorker' in navigator && window.location.search.indexOf('reset') === -1) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('%BASE_URL%sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              reg.update();
            })
            .catch(function () {});

          var reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
