<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>PYQ — Previous Year Questions</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">

<script>
/* Theme must land before first paint. On DOMContentLoaded the app flashes the wrong theme
   on every launch, which on a phone reads as a broken app rather than a slow one. */
(function () {
  try {
    var t = localStorage.getItem('pyq-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private browsing throws on access; the media query still handles it */ }
})();

/* Escape hatch for a wedged service worker or corrupt local state. */
if (location.search.indexOf('reset') !== -1) {
  (async function () {
    try {
      if ('serviceWorker' in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) await regs[i].unregister();
      }
      if ('caches' in window) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
      try { localStorage.clear(); } catch (e) {}
      if (window.indexedDB && indexedDB.deleteDatabase) indexedDB.deleteDatabase('PyqAppDB');
    } catch (e) {}
    location.replace(location.pathname);
  })();
}
</script>
</head>
<body>

<header class="appbar">
  <button class="iconbtn" id="back-btn" aria-label="Go back" hidden>←</button>
  <div class="appbar__title" id="appbar-title">PYQ</div>
  <button class="iconbtn" id="theme-btn" aria-label="Switch between light and dark">◐</button>
</header>

<main id="app" role="main">
  <div class="spinner" role="status" aria-label="Loading"></div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tabbar__item" data-screen="home"><span>🏠</span><span>Home</span></button>
  <button class="tabbar__item" data-screen="practice"><span>📚</span><span>Practice</span></button>
  <button class="tabbar__item" data-screen="tests"><span>🎯</span><span>Tests</span></button>
  <button class="tabbar__item" data-screen="review"><span>🧠</span><span>Review</span></button>
  <button class="tabbar__item" data-screen="stats"><span>📊</span><span>Stats</span></button>
</nav>

<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div class="boot-error">
    <h2>JavaScript is required</h2>
    <p>This app runs entirely on your device and needs JavaScript to load the question bank.</p>
  </div>
</noscript>

<script type="module">
  import { boot } from './src/app.js';
  boot().catch(function (err) {
    /* Last line of defence: never leave a white page. */
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML =
      '<div class="boot-error"><h2>The app could not start</h2>' +
      '<p>Something went wrong while loading. Resetting clears cached data and usually fixes it.</p>' +
      '<p><code></code></p>' +
      '<a class="btn btn--primary" href="?reset">Reset and reload</a></div>';
    var code = app.querySelector('code');
    if (code) code.textContent = (err && err.message) ? err.message : String(err);
    console.error('Boot failed', err);
  });
</script>

</body>
</html>
